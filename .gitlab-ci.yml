image: docker:latest

variables:
  # Prefer a runner-mounted socket; otherwise use the non-TLS dind service.
  FF_NETWORK_PER_BUILD: "true"
  DOCKER_TLS_CERTDIR: ""
services:
  - name: docker:dind
    alias: docker
    variables:
      HEALTHCHECK_TCP_PORT: "2375"

build-docker:
  variables:
    VID: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_TAG =~ /.+/
      variables:
        VID: $CI_COMMIT_TAG
        
    - when: manual
  stage: build
  before_script:
    - docker info
    - apk update
    - apk add --no-cache git xz

  script:
    - CLEAN_TAG="${CI_COMMIT_TAG#v}"
    - CLEAN_TAG="${CLEAN_TAG:-$VID}"
    - docker build -f Dockerfile -t korap/kustvakt:$CLEAN_TAG .
    - ARTIFACT=kustvakt-${CLEAN_TAG}.tar.xz
    - docker save korap/kustvakt:$CLEAN_TAG | xz > $ARTIFACT
  artifacts:
    paths:
      - kustvakt-*.tar.xz

push-dockerhub:
  stage: deploy
  image: docker:latest
  needs:
    - job: build-docker
      artifacts: true
  dependencies:
    - build-docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.+/
      when: manual
    - when: never    
  script:
    - docker info
    - apk update
    - apk add --no-cache xz
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - CLEAN_TAG="${CI_COMMIT_TAG#v}"
    - ARTIFACT=kustvakt-$CLEAN_TAG.tar.xz
    - xz -d -c "$ARTIFACT" | docker load
    - docker tag korap/kustvakt:$CLEAN_TAG korap/kustvakt:latest
    - docker tag korap/kustvakt:$CLEAN_TAG korap/kustvakt:latest-full
    - docker push korap/kustvakt:$CLEAN_TAG
    - docker push korap/kustvakt:latest
    - docker push korap/kustvakt:latest-full
  
